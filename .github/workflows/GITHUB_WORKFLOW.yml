
name: Build Flousy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION_CODE_BASE: 1000

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Unpack project ZIP
        run: |
          set -e

          if [ ! -f pubspec.yaml ]; then
            z=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)

            if [ -z "$z" ]; then
              echo "::error::No pubspec.yaml or project ZIP found"
              exit 1
            fi

            mkdir -p _unz
            unzip -q "$z" -d _unz

            root=$(find _unz -maxdepth 5 -type f \
              -name pubspec.yaml \
              -not -path '*/.dart_tool/*' |
              head -1 | xargs -r dirname)

            if [ -z "$root" ]; then
              echo "::error::pubspec.yaml not found in ZIP"
              exit 1
            fi

            cp -a "$root"/. .
          fi

          test -f pubspec.yaml
          test -f tool/setup_android.sh

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Prepare Android project
        run: bash tool/setup_android.sh

      - name: Check Supabase settings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing Supabase Repository Variables"
            exit 1
          fi

          case "$SUPABASE_URL" in
            https://*) ;;
            *)
              echo "::error::Invalid SUPABASE_URL"
              exit 1
              ;;
          esac

          echo "Supabase settings found"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Format Dart code
        run: dart format lib test

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # First run creates the key and stores it using GitHub's
      # encrypted repository-secrets API. Later runs reuse it.
      - name: Prepare persistent signing key
        env:
          EXISTING_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          EXISTING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EXISTING_ALIAS: ${{ secrets.KEY_ALIAS }}
          EXISTING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BOOTSTRAP_TOKEN: ${{ secrets.SECRETS_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          set +x

          if [ -n "${EXISTING_KEYSTORE:-}" ]; then
            KS_PASS="${EXISTING_STORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
            ALIAS="${EXISTING_ALIAS:?Missing KEY_ALIAS}"
            K_PASS="${EXISTING_KEY_PASSWORD:-$KS_PASS}"

            echo "$EXISTING_KEYSTORE" | base64 -d > release.jks

            echo "Using existing persistent signing key"

          else
            if [ -z "${BOOTSTRAP_TOKEN:-}" ]; then
              echo "::error::Add SECRETS_BOOTSTRAP_TOKEN to GitHub Actions Secrets before the first run."
              exit 1
            fi

            echo "Generating first signing key"

            KS_PASS="$(openssl rand -hex 32)"
            K_PASS="$KS_PASS"
            ALIAS="flousy"

            keytool -genkeypair \
              -keystore release.jks \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -dname "CN=Flousy,O=Flousy,C=EG"

            KEYSTORE_B64="$(base64 -w 0 release.jks)"

            echo "::add-mask::$KS_PASS"
            echo "::add-mask::$KEYSTORE_B64"

            python -m pip install --quiet pynacl

            export KS_PASS K_PASS ALIAS KEYSTORE_B64

            python <<'PY'
          import os
          import json
          import base64
          import urllib.request
          from nacl.public import PublicKey, SealedBox

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["BOOTSTRAP_TOKEN"]
          api = f"https://api.github.com/repos/{repo}/actions/secrets"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(url, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read()) if response.length != 0 else {}

          public = request(api + "/public-key")
          public_key = PublicKey(base64.b64decode(public["key"]))
          box = SealedBox(public_key)

          values = {
              "KEYSTORE_BASE64": os.environ["KEYSTORE_B64"],
              "KEYSTORE_PASSWORD": os.environ["KS_PASS"],
              "KEY_ALIAS": os.environ["ALIAS"],
              "KEY_PASSWORD": os.environ["K_PASS"],
          }

          for name, value in values.items():
              encrypted = base64.b64encode(
                  box.encrypt(value.encode())
              ).decode()

              request(
                  f"{api}/{name}",
                  method="PUT",
                  body={
                      "encrypted_value": encrypted,
                      "key_id": public["key_id"],
                  },
              )

          print("Signing secrets saved successfully.")
          PY

          fi

          {
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$K_PASS"
          } >> "$GITHUB_ENV"

          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$K_PASS"

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          flutter build apk --release --no-shrink \
            --build-number=$(( VERSION_CODE_BASE + GITHUB_RUN_NUMBER )) \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Sign release APK
        run: |
          set -euo pipefail

          mkdir -p dist

          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SRC="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$SRC"
          test -f release.jks

          "$BT/zipalign" -f -p 4 "$SRC" dist/aligned.apk

          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out dist/flousy-release.apk \
            dist/aligned.apk

          "$BT/apksigner" verify --verbose dist/flousy-release.apk

          rm -f dist/aligned.apk release.jks

          ls -lh dist/flousy-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flousy-release-apk
          path: dist/flousy-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Flousy (latest build)" \
              --notes "Latest automated build from main" \
              --prerelease
          fi

          gh release upload latest dist/flousy-release.apk --clobber

          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/flousy-release.apk" \
            >> "$GITHUB_STEP_SUMMARY"
