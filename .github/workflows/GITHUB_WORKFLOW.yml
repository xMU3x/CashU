
name: Build Flousy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION_CODE_BASE: 1000

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Unpack ZIP if the repository contains only the project archive
      - name: Unpack project ZIP
        run: |
          set -e

          if [ ! -f pubspec.yaml ]; then
            z=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)

            if [ -z "$z" ]; then
              echo "::error::No pubspec.yaml or project ZIP found"
              exit 1
            fi

            mkdir -p _unz
            unzip -q "$z" -d _unz

            root=$(find _unz -maxdepth 5 -type f -name pubspec.yaml \
              -not -path '*/.dart_tool/*' | head -1 | xargs -r dirname)

            if [ -z "$root" ]; then
              echo "::error::pubspec.yaml not found inside ZIP"
              exit 1
            fi

            cp -a "$root"/. .
          fi

          test -f pubspec.yaml
          test -f tool/setup_android.sh

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Prepare Android project
        run: bash tool/setup_android.sh

      - name: Check Supabase settings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY in Repository Variables"
            exit 1
          fi

          case "$SUPABASE_URL" in
            https://*) ;;
            *)
              echo "::error::SUPABASE_URL must start with https://"
              exit 1
              ;;
          esac

          echo "Supabase configuration found"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      # Format files before checking them
      - name: Format Dart code
        run: dart format lib test

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -e

          flutter build apk --release --no-shrink \
            --build-number=$(( VERSION_CODE_BASE + GITHUB_RUN_NUMBER )) \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p dist

          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SRC="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$SRC"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing KEYSTORE_BASE64. Configure the APK signing secrets."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

          KS_PASS="${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          ALIAS="${KEY_ALIAS:?Missing KEY_ALIAS}"
          K_PASS="${KEY_PASSWORD:-$KS_PASS}"

          "$BT/zipalign" -f -p 4 "$SRC" dist/aligned.apk

          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$K_PASS" \
            --out dist/flousy-release.apk \
            dist/aligned.apk

          "$BT/apksigner" verify dist/flousy-release.apk

          rm -f release.jks dist/aligned.apk

          ls -lh dist/flousy-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flousy-release-apk
          path: dist/flousy-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Flousy (latest build)" \
              --notes "Latest automated build from main" \
              --prerelease
          fi

          gh release upload latest dist/flousy-release.apk --clobber

          echo "APK URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/flousy-release.apk" \
            >> "$GITHUB_STEP_SUMMARY"
