name: Build Habittly Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write # لنشر الـ APK في Release ثابت باسم "latest"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE_BASE: 1000 # versionCode = 1000 + رقم التشغيل

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter / Dart / Java versions
        run: |
          flutter --version
          java -version

      - name: Prepare Android project (generate + JVM 17 init script)
        run: bash tool/setup_android.sh

      - name: Show generated Gradle / AGP / Kotlin versions
        run: |
          cat android/gradle/wrapper/gradle-wrapper.properties | grep distributionUrl
          grep -nE "com.android.application|org.jetbrains.kotlin.android|JavaVersion|jvmTarget|sourceCompatibility" android/settings.gradle* android/app/build.gradle* || true

      - name: Resolve Supabase public key
        env:
          SECRET_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          KEY="$SECRET_KEY"
          if [ -z "$KEY" ] && [ -f js/config.js ]; then
            KEY=$(grep -oE "SUPABASE_KEY: *'[^']+'" js/config.js | sed -E "s/.*'([^']+)'.*/\1/" | head -1)
          fi
          if [ -z "$KEY" ]; then echo "::error::لم يُعثر على SUPABASE_ANON_KEY"; exit 1; fi
          echo "::add-mask::$KEY"
          echo "SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Format Dart code
        run: dart format lib test

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=3.1.0 \
            --build-number=$(( VERSION_CODE_BASE + GITHUB_RUN_NUMBER )) \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SRC=build/app/outputs/flutter-apk/app-release.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            KS_PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; K_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "التوقيع بمفتاح المستودع"
          else
            echo "::warning::لا يوجد Keystore في الأسرار — توقيع بمفتاح مؤقت"
            keytool -genkeypair -keystore release.jks -alias werd -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android -dname "CN=Werd,O=Werd,C=EG"
            KS_PASS=android; ALIAS=werd; K_PASS=android
          fi
          "$BT/zipalign" -f -p 4 "$SRC" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$K_PASS" \
            --out dist/habittly-release.apk aligned.apk
          "$BT/apksigner" verify dist/habittly-release.apk
          rm -f release.jks aligned.apk
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: habittly-release-apk
          path: dist/habittly-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Habittly (latest build)" --notes "أحدث بناء تلقائي من فرع main" --prerelease
          gh release upload latest dist/habittly-release.apk --clobber
          echo "https://github.com/${{ github.repository }}/releases/download/latest/habittly-release.apk" >> "$GITHUB_STEP_SUMMARY"
