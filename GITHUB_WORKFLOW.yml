name: Build Flousy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write # لنشر الـ APK في Release ثابت باسم "latest"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE_BASE: 1000 # versionCode = 1000 + رقم التشغيل

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # لو الريبو فيه ملف zip بس (رفع من الموبايل) نفكّه هنا قبل البناء
      - name: Unpack project zip (only if repo has just the zip)
        run: |
          if [ ! -f pubspec.yaml ]; then
            z=$(ls *.zip 2>/dev/null | head -1)
            [ -n "$z" ] || { echo "::error::مفيش pubspec.yaml ولا ملف zip في الريبو"; exit 1; }
            mkdir _unz && unzip -q "$z" -d _unz
            root=$(find _unz -maxdepth 2 -name pubspec.yaml -printf '%h\n' | head -1)
            [ -n "$root" ] || { echo "::error::الـ zip مفيهوش pubspec.yaml"; exit 1; }
            cp -a "$root"/. .
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter / Dart / Java versions
        run: |
          flutter --version
          java -version

      - name: Prepare Android project (generate + manifest + JVM 17 init script)
        run: bash tool/setup_android.sh

      - name: Check Supabase settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::لازم تضيف الأسرار SUPABASE_URL و SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "::add-mask::$SUPABASE_ANON_KEY"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Format Dart code
        run: dart format lib test

      - name: Analyze Flutter project
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --no-shrink \
            --build-number=$(( VERSION_CODE_BASE + GITHUB_RUN_NUMBER )) \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SRC=build/app/outputs/flutter-apk/app-release.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            KS_PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; K_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "التوقيع بمفتاح المستودع"
          else
            echo "::warning::لا يوجد Keystore في الأسرار — توقيع بمفتاح مؤقت (مش هيتحدّث فوق نسخة موقّعة بمفتاح تاني)"
            keytool -genkeypair -keystore release.jks -alias flousy -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android -dname "CN=Flousy,O=Flousy,C=EG"
            KS_PASS=android; ALIAS=flousy; K_PASS=android
          fi
          "$BT/zipalign" -f -p 4 "$SRC" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$K_PASS" \
            --out dist/flousy-release.apk aligned.apk
          "$BT/apksigner" verify dist/flousy-release.apk
          rm -f release.jks aligned.apk
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flousy-release-apk
          path: dist/flousy-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Flousy (latest build)" --notes "أحدث بناء تلقائي من فرع main" --prerelease
          gh release upload latest dist/flousy-release.apk --clobber
          echo "https://github.com/${{ github.repository }}/releases/download/latest/flousy-release.apk" >> "$GITHUB_STEP_SUMMARY"
