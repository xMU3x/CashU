name: Build CashU (Kotlin Native)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Lint
        run: gradle --no-daemon :app:lintDebug
      - name: Assemble release APK + AAB
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          case "$SUPABASE_ANON_KEY" in sb_secret_*) echo "::error::لا تستخدم مفتاح secret/service في التطبيق"; exit 1;; esac
          [ -n "$SUPABASE_ANON_KEY" ] || echo "::warning::SUPABASE_ANON_KEY غير مضبوط — المزامنة ستكون معطّلة (التطبيق يعمل محليًا)"
          gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            KS_PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; K_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::لا يوجد Keystore — توقيع بمفتاح مؤقت"
            keytool -genkeypair -keystore release.jks -alias cashu -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android -dname "CN=CashU,O=CashU,C=EG"
            KS_PASS=android; ALIAS=cashu; K_PASS=android
          fi
          "$BT/zipalign" -f -p 4 "$SRC" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$K_PASS" --out dist/CashU.apk aligned.apk
          "$BT/apksigner" verify dist/CashU.apk
          cp app/build/outputs/bundle/release/*.aab dist/CashU.aab
          rm -f release.jks aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CashU
          path: |
            dist/CashU.apk
            dist/CashU.aab
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
