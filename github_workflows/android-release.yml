name: Build CashU Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE_BASE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # لو رفعت المشروع كملف ZIP واحد فقط (بدون فك) يفكّه تلقائيًا ويكمل.
      - name: Unpack project ZIP (if needed)
        run: |
          set -e
          if [ ! -f pubspec.yaml ]; then
            z=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)
            if [ -z "$z" ]; then
              echo "::error::No pubspec.yaml or project ZIP found"
              exit 1
            fi
            mkdir -p _unz
            unzip -q "$z" -d _unz
            root=$(find _unz -maxdepth 5 -type f -name pubspec.yaml -not -path '*/.dart_tool/*' | head -1 | xargs -r dirname)
            if [ -z "$root" ]; then
              echo "::error::pubspec.yaml not found in ZIP"
              exit 1
            fi
            cp -a "$root"/. .
          fi
          test -f pubspec.yaml
          test -f tool/setup_android.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Prepare Android project
        run: bash tool/setup_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        # الأخطاء (errors) توقف الـ workflow؛ التحذيرات والـ infos لا توقفه.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      # مفتاح التوقيع الثابت (عشان التحديثات تتثبّت فوق بعض):
      # - لو الأسرار KEYSTORE_* موجودة → تُستخدم.
      # - لو مش موجودة وفيه SECRETS_BOOTSTRAP_TOKEN (توكن بصلاحية Secrets: write) → يولّد مفتاح مرة واحدة ويحفظه في أسرار المستودع.
      # - غير كده → مفتاح مؤقت (تحذير): كل بناء بتوقيع مختلف ولا يُنصح به للتحديثات.
      - name: Prepare signing key
        env:
          EXISTING_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          EXISTING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EXISTING_ALIAS: ${{ secrets.KEY_ALIAS }}
          EXISTING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BOOTSTRAP_TOKEN: ${{ secrets.SECRETS_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          if [ -n "${EXISTING_KEYSTORE:-}" ]; then
            KS_PASS="${EXISTING_STORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
            ALIAS="${EXISTING_ALIAS:?Missing KEY_ALIAS}"
            K_PASS="${EXISTING_KEY_PASSWORD:-$KS_PASS}"
            echo "$EXISTING_KEYSTORE" | base64 -d > release.jks
            echo "Using existing persistent signing key"
          elif [ -n "${BOOTSTRAP_TOKEN:-}" ]; then
            echo "Generating first signing key"
            KS_PASS="$(openssl rand -hex 32)"
            K_PASS="$KS_PASS"
            ALIAS="cashu"
            keytool -genkeypair -keystore release.jks -alias "$ALIAS" -keyalg RSA -keysize 3072 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$K_PASS" -dname "CN=CashU,O=CashU,C=EG"
            KEYSTORE_B64="$(base64 -w 0 release.jks)"
            echo "::add-mask::$KS_PASS"
            echo "::add-mask::$KEYSTORE_B64"
            python -m pip install --quiet pynacl
            export KS_PASS K_PASS ALIAS KEYSTORE_B64
            python <<'PY'
          import os, json, base64, urllib.request
          from nacl.public import PublicKey, SealedBox

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["BOOTSTRAP_TOKEN"]
          api = f"https://api.github.com/repos/{repo}/actions/secrets"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(url, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}

          public = request(api + "/public-key")
          box = SealedBox(PublicKey(base64.b64decode(public["key"])))
          values = {
              "KEYSTORE_BASE64": os.environ["KEYSTORE_B64"],
              "KEYSTORE_PASSWORD": os.environ["KS_PASS"],
              "KEY_ALIAS": os.environ["ALIAS"],
              "KEY_PASSWORD": os.environ["K_PASS"],
          }
          for name, value in values.items():
              enc = base64.b64encode(box.encrypt(value.encode())).decode()
              request(f"{api}/{name}", method="PUT", body={"encrypted_value": enc, "key_id": public["key_id"]})
          print("Signing secrets saved successfully.")
          PY
          else
            echo "::warning::لا يوجد Keystore ولا SECRETS_BOOTSTRAP_TOKEN — توقيع بمفتاح مؤقت (لن تتحدّث النسخة المثبّتة فوق بعضها)"
            KS_PASS="$(openssl rand -hex 16)"
            K_PASS="$KS_PASS"
            ALIAS="cashu"
            keytool -genkeypair -keystore release.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$K_PASS" -dname "CN=CashU,O=CashU,C=EG"
          fi
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$K_PASS"
          {
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$K_PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SECRET_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SECRET_KEY" ]; then
            echo "::error::Secret SUPABASE_ANON_KEY غير مضبوط — مفتاح المشروع مطلوب للمزامنة"
            exit 1
          fi
          case "$SECRET_KEY" in sb_secret_*) echo "::error::لا تستخدم مفتاح secret/service في التطبيق"; exit 1;; esac
          flutter build apk --release --no-shrink \
            --build-name=1.0.0 \
            --build-number=$(( VERSION_CODE_BASE + GITHUB_RUN_NUMBER )) \
            --dart-define=SUPABASE_ANON_KEY="$SECRET_KEY"

      - name: Sign release APK
        run: |
          set -euo pipefail
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SRC=build/app/outputs/flutter-apk/app-release.apk
          test -f "$SRC"
          test -f release.jks
          "$BT/zipalign" -f -p 4 "$SRC" dist/aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out dist/cashu-release.apk dist/aligned.apk
          "$BT/apksigner" verify --verbose dist/cashu-release.apk
          rm -f dist/aligned.apk release.jks
          "$BT/aapt" dump badging dist/cashu-release.apk | grep -E "^package: name='com\.cashu\.cashu'" \
            || { echo "::error::applicationId mismatch (expected com.cashu.cashu)"; exit 1; }
          ls -lh dist/cashu-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cashu-release-apk
          path: dist/cashu-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "CashU (latest build)" --notes "أحدث بناء تلقائي من main" --prerelease
          gh release upload latest dist/cashu-release.apk --clobber
          echo "https://github.com/${{ github.repository }}/releases/download/latest/cashu-release.apk" >> "$GITHUB_STEP_SUMMARY"
