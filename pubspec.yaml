name: cashu
description: CashU — تتبّع المصاريف وتتبّع رسائل البنك محليًا، مع مزامنة Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  # إشعارات محلية مجدولة (تعمل بدون إنترنت). الإصدار مثبّت لأن الـ API بيتغيّر بين الإصدارات الكبيرة.
  flutter_local_notifications: 19.5.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icon.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    # Inter (OFL) = أقرب بديل مفتوح الترخيص لـ SF Pro Text؛ SF Pro نفسه لا يجوز تضمينه في Android (ترخيص Apple).
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    # SF Pro Display (ملفات المطوّر) للإنجليزي والأرقام + IBM Plex Sans Arabic (OFL) للعربي.
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
    # League Spartan (OFL) للأرقام والإنجليزي.
    - family: LeagueSpartan
      fonts:
        - asset: assets/fonts/LeagueSpartan-Regular.ttf
        - asset: assets/fonts/LeagueSpartan-Medium.ttf
          weight: 500
        - asset: assets/fonts/LeagueSpartan-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/LeagueSpartan-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-400.ttf
        - asset: assets/fonts/NotoSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-700.ttf
          weight: 700
    # Ping AR + LT (خط عربي/إنجليزي واحد) — خط تجاري: لازم يكون عندك ترخيص استخدام له.
    - family: PingARLT
      fonts:
        - asset: assets/fonts/PingARLT-Thin.otf
          weight: 100
        - asset: assets/fonts/PingARLT-Extralight.otf
          weight: 200
        - asset: assets/fonts/PingARLT-Light.otf
          weight: 300
        - asset: assets/fonts/PingARLT-Regular.otf
          weight: 400
        - asset: assets/fonts/PingARLT-Medium.otf
          weight: 500
        - asset: assets/fonts/PingARLT-Bold.otf
          weight: 700
        - asset: assets/fonts/PingARLT-Heavy.otf
          weight: 800
        - asset: assets/fonts/PingARLT-Black.otf
          weight: 900
