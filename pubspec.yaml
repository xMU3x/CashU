name: cashu
description: CashU — تتبّع المصاريف وتتبّع رسائل البنك محليًا، مع مزامنة Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  # إشعارات محلية مجدولة (تعمل بدون إنترنت). الإصدار مثبّت لأن الـ API بيتغيّر بين الإصدارات الكبيرة.
  flutter_local_notifications: 19.5.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#1F6FE5"
  adaptive_icon_foreground: assets/brand/app_icon_fg.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    # Ping AR + LT (خط عربي/إنجليزي واحد) — خط تجاري: لازم يكون عندك ترخيص استخدام له.
    - family: PingARLT
      fonts:
        - asset: assets/fonts/PingARLT-Thin.otf
          weight: 100
        - asset: assets/fonts/PingARLT-Extralight.otf
          weight: 200
        - asset: assets/fonts/PingARLT-Light.otf
          weight: 300
        - asset: assets/fonts/PingARLT-Regular.otf
          weight: 400
        - asset: assets/fonts/PingARLT-Medium.otf
          weight: 500
        - asset: assets/fonts/PingARLT-Bold.otf
          weight: 700
        - asset: assets/fonts/PingARLT-Heavy.otf
          weight: 800
        - asset: assets/fonts/PingARLT-Black.otf
          weight: 900
