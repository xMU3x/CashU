name: cashu
description: CashU — تتبّع المصاريف وتتبّع رسائل البنك محليًا، مع مزامنة Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icon.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    # Plus Jakarta Sans (OFL) = الإنجليزي والأرقام · Readex Pro (OFL) = العربي. الربط المركزي: lib/ui/typography.dart
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-400.ttf
        - asset: assets/fonts/ReadexPro-500.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-600.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-700.ttf
          weight: 700
